[project]
name = "smartcc"
version = "0.1.0"
description = "A desktop application that uses AI to \"listen\" to your hardware synthesizers, catalog their sounds automatically, and let you search them like a Google image search."
authors = [
    {name = "Ivan Agyapong",email = "ivanpagyapong@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rtmidi (>=2.5.0,<3.0.0)",
    "sounddevice (>=0.5.3,<0.6.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
